<p-card class="w-full overflow-hidden"subheader="Marie Dubois • 2025-10-01">
  <ng-template #header>
    <img class="block w-full" alt="Angular" src="images-articles/angular.jpg" />
  </ng-template>
  <ng-template #title>
    <span class="font-bold">Introduction à Angular</span>
  </ng-template>
  <p >
    Découvrez les fondamentaux d'Angular et comment créer votre première application.
  </p>
  <ng-template #footer>
    <div class="flex justify-content-end">
      <button type="button" pButton>Lire l'article</button>
    </div>
  </ng-template>
</p-card>
