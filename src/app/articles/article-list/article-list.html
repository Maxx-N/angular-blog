<div class="text-center text-color py-4">
  <h1 class="text-6xl m-0">Bienvenue sur <span class="text-primary">Angular Blog</span></h1>
  <p class="text-2xl">Découvrez les derniers articles sur le développement web et Angular</p>
</div>
<ul class="grid list-none p-0">
  @for (article of articles(); track article.id) {
    <li class="col-12 md:col-6 lg:col-4">
      <app-article-card [article]="article" />
    </li>
  }
</ul>
