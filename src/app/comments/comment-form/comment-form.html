<form class="surface-50 border-round-xl p-4 mt-4 flex flex-column gap-4">
  <h3 class="text-xl font-bold m-0">Ajouter un commentaire</h3>

  <div class="flex flex-column gap-2">
    <label for="comment-author" class="font-semibold">Nom *</label>
    <input pInputText id="comment-author" type="text" placeholder="Votre nom" [fluid]="true" />
  </div>

  <div class="flex flex-column gap-2">
    <label for="comment-content" class="font-semibold">Commentaire *</label>
    <textarea
      pTextarea
      id="comment-content"
      rows="4"
      placeholder="Votre commentaire (minimum 10 caractères)"
      [fluid]="true"
    ></textarea>
  </div>

  <div>
    <button pButton type="submit">Publier le commentaire</button>
  </div>
</form>
